# Finovra v4.0.0 — Accounts + Insurance + Investments + Loans. Nothing greyed out.
services:
  dashboard:
    image: arsr319/finovra-dashboard:4.0.0
    ports:
      - "8082:3000"
    environment:
      - PORT=3000
      - VERSION=4.0.0
      - SERVICES=accounts:http://accounts-service:8000,insurance:http://insurance-service:8000,investments:http://investments-service:8000,loans:http://loans-service:8000
    depends_on:
      - accounts-service
      - insurance-service
      - investments-service
      - loans-service

  accounts-service:
    image: arsr319/finovra-accounts-service:4.0.0
    environment:
      - PORT=8000
      - VERSION=4.0.0
      - FAIL_MODE=false
      - LATENCY_MS=0

  insurance-service:
    image: arsr319/finovra-insurance-service:4.0.0
    environment:
      - PORT=8000
      - VERSION=4.0.0
      - FAIL_MODE=false
      - LATENCY_MS=0

  investments-service:
    image: arsr319/finovra-investments-service:4.0.0
    environment:
      - PORT=8000
      - VERSION=4.0.0
      - FAIL_MODE=false
      - LATENCY_MS=0

  loans-service:
    image: arsr319/finovra-loans-service:4.0.0
    environment:
      - PORT=8000
      - VERSION=4.0.0
      - FAIL_MODE=false
      - LATENCY_MS=0
